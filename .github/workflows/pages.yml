# GitHub Pages への自動公開ワークフロー（ビルド不要の静的サイト）
name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# deploy-pages に必要
permissions:
  contents: read
  pages: write
  id-token: write

# 連続実行を直列化
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: GitHub Pages を設定
        uses: actions/configure-pages@v5

      - name: サイト（静的ファイル）をアーティファクトにアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
